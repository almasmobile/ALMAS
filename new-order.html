<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#ffffff"><meta name="color-scheme" content="light">
<title>سفارش جدید کالا — الماس موبایل 💎</title>
<link rel="icon" type="image/png" href="assets/logo-black.png"><link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ALMAS">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="new-order"><header class="site-header"><a href="index.html" class="brand"><img src="assets/logo-black.png" alt="الماس موبایل"></a></header>
<main class="container"><a href="index.html" class="back-link">بازگشت به خانه</a><h1 class="page-title">سفارش جدید کالا</h1><p class="page-sub">ثبت کالایی که مشتری درخواست کرده اما فعلاً در فروشگاه موجود نیست</p>
<form id="new-order-form" novalidate>
<section class="section form-panel"><h2>مشخصات کالا</h2>
<div class="form-group"><label class="field-label" for="item-name">نام کالا / مدل</label><input id="item-name" name="itemName" type="text" required placeholder="مثلاً قاب آیفون ۱۶ پرو مکس"></div>
<div class="form-group"><label class="field-label" for="item-details">رنگ، ظرفیت یا توضیحات</label><input id="item-details" name="itemDetails" type="text" placeholder="رنگ، حافظه، مدل دقیق و..."></div>

</section>
<section class="section form-panel"><h2>قیمت و زمان تحویل</h2>
<div class="form-group"><label class="field-label" for="agreed-price">قیمت نهایی توافق‌شده (تومان)</label><input id="agreed-price" name="agreedPrice" type="number" min="0" step="1000" required placeholder="مثلاً ۵۵۰۰۰۰۰" dir="ltr"><span class="hint" id="agreed-price-words"></span></div>
<div class="form-group"><label class="field-label" for="expected-date">تاریخ تقریبی تحویل (شمسی)</label><div class="jalali-picker-field"><input id="expected-date" name="expectedDate" type="text" placeholder="انتخاب تاریخ شمسی" autocomplete="off" readonly><button type="button" id="jalali-calendar-toggle" class="btn btn-secondary btn-small" aria-label="باز کردن تقویم">انتخاب تاریخ</button></div><div id="jalali-calendar" class="jalali-calendar hidden" aria-label="تقویم شمسی"></div></div>
<div class="form-group"><label class="field-label" for="order-notes">توضیحات سفارش</label><textarea id="order-notes" name="orderNotes" rows="3" placeholder="هر نکته‌ای که برای تهیه کالا لازم است"></textarea></div>
</section>
<section class="section form-panel"><h2>اطلاعات مشتری</h2>
<div class="form-group"><label class="field-label" for="firstName">نام</label><input type="text" id="firstName" name="firstName" required autocomplete="given-name"></div>
<div class="form-group"><label class="field-label" for="lastName">نام خانوادگی</label><input type="text" id="lastName" name="lastName" required autocomplete="family-name"></div>
<div class="form-group"><label class="field-label" for="phone">شماره موبایل</label><input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel" placeholder="09xxxxxxxxx" required dir="ltr"></div>
</section>
<div class="total-box"><span>مبلغ قابل پرداخت:</span><span class="amount" id="new-order-balance">—</span></div>
<button type="submit" class="btn">ثبت سفارش و آماده‌سازی پیامک</button></form>
<div class="sms-preview" id="sms-preview"></div><button type="button" class="btn btn-secondary hidden" id="copy-btn">کپی متن پیامک</button>
</main><footer class="site-footer"><div class="footer-info"><div class="footer-logo"><img src="assets/logo-black.png" alt="لوگوی الماس موبایل"></div><div class="footer-address"><span>تهران، بلوار مرزداران، خیابان سپهر، پاساژ پردیسان، جنب درب ورودی، پلاک ۴۶</span></div></div></footer>
<script src="assets/app.js"></script></body></html>
